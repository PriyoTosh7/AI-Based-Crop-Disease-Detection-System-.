name: Project checks
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python sources
        run: python -m compileall -q backend src
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js && node --check frontend/data.js && node --check frontend/config.js
      - name: Verify required project files
        run: |
          test -f backend/app/main.py
          test -f frontend/index.html
          test -f requirements.txt
          test -f Dockerfile
          test -f outputs/confusion_matrix.npy
          test -f outputs/model_export/class_names.json
